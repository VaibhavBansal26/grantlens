# Publish the images and deploy them, but only for commits whose CI run passed.
#   master        -> images tagged with the commit, deployed to the "staging" environment
#   tag v1.2.3    -> images also tagged v1.2.3, deployed to the "production" environment
# Deploys need a server and these secrets in the environment (Settings > Environments); without DEPLOY_HOST the deploy
# job reports "no server configured" and succeeds, so publishing images works from day one.
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (output of ssh-keyscan), DEPLOY_PATH
# Put required reviewers on the "production" environment to make every production deploy wait for a click.
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref: {description: "Commit or tag to publish and deploy", required: true}

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'master' || startsWith(github.event.workflow_run.head_branch, 'v')) && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      production: ${{ steps.meta.outputs.production }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.workflow_run.head_sha || inputs.ref }}"}
      - id: meta
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sha="$(git rev-parse HEAD)"
          branch="$BRANCH"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=${sha:0:12}" >> "$GITHUB_OUTPUT"
          case "$branch" in v*) echo "production=true" >> "$GITHUB_OUTPUT"; echo "version=$branch" >> "$GITHUB_OUTPUT";; *) echo "production=false" >> "$GITHUB_OUTPUT"; echo "version=" >> "$GITHUB_OUTPUT";; esac
          echo "owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/grantlens-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/grantlens-api:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: API_INTERNAL_URL=http://api:5000
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/grantlens-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/grantlens-web:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ needs.images.outputs.production == 'true' && 'production' || 'staging' }}
    concurrency: {group: "deploy-${{ needs.images.outputs.production }}", cancel-in-progress: false}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "No server configured (DEPLOY_HOST is empty): images were published, nothing was deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned, never trust-on-first-use
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && scripts/deploy.sh '${{ needs.images.outputs.sha }}' '${{ needs.images.outputs.tag }}'"
          echo "Deployed ${{ needs.images.outputs.tag }} to $DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
