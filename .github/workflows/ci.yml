name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: grantlens, POSTGRES_PASSWORD: grantlens, POSTGRES_DB: grantlens}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grantlens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://grantlens:grantlens@localhost:5432/grantlens
      FLASK_APP: grantlens_api:create_app
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # The whole migration chain must replay from an empty database...
      - run: uv run flask db upgrade
      # ...and the models must not have drifted from it (a model change without a migration fails here).
      - run: uv run flask db check
      - run: uv run --with pip-audit pip-audit

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env: {API_INTERNAL_URL: "http://api:5000"}
      - run: npm audit --audit-level=high

  images:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only (no push): proves the production images still build from the lockfiles.
      - run: docker build apps/api
      - run: docker build apps/web

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test_deploy.sh
      - name: The production compose files are valid, with and without the published-image overlay
        env: {SECRET_KEY: "0123456789012345678901234567890123456789", POSTGRES_PASSWORD: ci, GHCR_OWNER: ci}
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.images.yml config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
