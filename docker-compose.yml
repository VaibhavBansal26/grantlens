services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grantlens
      POSTGRES_PASSWORD: grantlens
      POSTGRES_DB: grantlens
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantlens"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  # Development: `docker compose up -d db redis`, then run the API and web app on the host (see README).
  # The production-shaped stack, with hardened images and no published database port, is docker-compose.prod.yml.
  api:
    build: ./apps/api
    env_file: .env
    ports: ["5055:5000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build:
      context: ./apps/web
      args: {API_INTERNAL_URL: "http://api:5000"}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
