services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grantlens
      POSTGRES_PASSWORD: grantlens
      POSTGRES_DB: grantlens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantlens"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    ports: ["5000:5000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
