[project]
name = "grantlens-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "flask-cors>=4.0",
  "flask-sqlalchemy>=3.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "redis>=5.0",
  "gunicorn>=22.0",
  "flask-migrate>=4.1.0",
  "httpx>=0.28.1",
  "pgvector>=0.5.1",
  "openai>=3.42.1",
  "pymupdf>=2.1",
  "flask-limiter>=4.1.1",
  "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# Error reporting, off unless SENTRY_DSN is set:  uv sync --extra observability
observability = ["sentry-sdk[flask]>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]
ml = [
    "numpy>=2.5.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.4",  # direct, so the CPU-only index below applies to it
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.uv]
default-groups = ["dev", "ml"]

# On Linux (the containers) use PyTorch's CPU-only wheels: the default ones pull in about 4 GB of CUDA
# libraries a CPU server can never use. macOS keeps the normal PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
