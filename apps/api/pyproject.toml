[project]
name = "grantlens-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "flask-cors>=4.0",
  "flask-sqlalchemy>=3.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "redis>=5.0",
  "gunicorn>=22.0",
  "flask-migrate>=4.1.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
