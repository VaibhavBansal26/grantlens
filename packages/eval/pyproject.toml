[project]
name = "grantlens-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
